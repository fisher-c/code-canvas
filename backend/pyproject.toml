[project]
name = "codepair-backend"
version = "0.1.0"
description = "FastAPI backend for the CodePair collaborative editor"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.124.0",
    "python-socketio>=5.15.0",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
