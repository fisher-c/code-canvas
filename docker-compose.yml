services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codecanvas
      POSTGRES_PASSWORD: codecanvas
      POSTGRES_DB: codecanvas
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codecanvas -d codecanvas" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://codecanvas:codecanvas@db:5432/codecanvas
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    command: sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
