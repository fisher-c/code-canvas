services:
  - type: web
    name: codecanvas
    env: node
    plan: free
    buildCommand: |
      npm run build
      cd server && npx prisma generate
    startCommand: |
      cd server
      npx prisma db push
      node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: codecanvas-db
          property: connectionString
      - key: CLIENT_ORIGIN
        generateValue: true

databases:
  - name: codecanvas-db
    databaseName: codecanvas
    user: codecanvas
    plan: free
