services:
  - type: web
    name: codecanvas
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: codecanvas-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://codecanvas.onrender.com

databases:
  - name: codecanvas-db
    databaseName: codecanvas
    user: codecanvas
